<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="900" viewBox="0 0 1500 900" role="img" aria-labelledby="title desc">
  <title id="title">Proposed Deep Learning Based Smart Home Design Block Diagram</title>
  <desc id="desc">A diagram showing user inputs and a labelled floor-plan dataset feeding a hybrid constraint and deep-learning layout generation process, then validated rendered floor-plan outputs.</desc>
  <defs>
    <linearGradient id="titleBg" x1="0" x2="1"><stop stop-color="#12355b"/><stop offset="1" stop-color="#1b6ca8"/></linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#17324d" flood-opacity=".15"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#31536f"/></marker>
    <style>.heading{font-family:Arial,sans-serif;font-size:23px;font-weight:700;fill:#17324d}.boxTitle{font-family:Arial,sans-serif;font-size:19px;font-weight:700;fill:#17324d;text-anchor:middle}.boxText{font-family:Arial,sans-serif;font-size:15px;fill:#38546d;text-anchor:middle}.small{font-family:Arial,sans-serif;font-size:13px;fill:#38546d;text-anchor:middle}.line{stroke:#31536f;stroke-width:3;fill:none;marker-end:url(#arrow)}.dash{stroke:#7692a8;stroke-width:3;stroke-dasharray:8 7;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1500" height="900" fill="#f7fafc"/>
  <rect x="55" y="30" width="1390" height="78" rx="14" fill="url(#titleBg)" filter="url(#shadow)"/>
  <text x="750" y="79" font-family="Arial, sans-serif" font-size="33" font-weight="700" fill="white" text-anchor="middle">Proposed Deep Learning Based Smart Home Design System</text>
  <text class="heading" x="237" y="155" text-anchor="middle">INPUTS</text><text class="heading" x="600" y="155" text-anchor="middle">DATASET AND TRAINING</text><text class="heading" x="1025" y="155" text-anchor="middle">HYBRID PLAN GENERATION</text><text class="heading" x="1325" y="155" text-anchor="middle">OUTPUTS</text>
  <g filter="url(#shadow)">
    <rect x="85" y="185" width="305" height="115" rx="12" fill="#e6f1ff" stroke="#5b91ca" stroke-width="2"/><text class="boxTitle" x="237" y="220">User Design Brief</text><text class="boxText" x="237" y="249">Plot size · floors · rooms</text><text class="boxText" x="237" y="273">Entrance · budget · Vastu</text>
    <rect x="85" y="360" width="305" height="100" rx="12" fill="#e6f1ff" stroke="#5b91ca" stroke-width="2"/><text class="boxTitle" x="237" y="400">Requirement Processing</text><text class="boxText" x="237" y="428">Validate inputs and create</text><text class="boxText" x="237" y="450">room programme</text>
    <rect x="448" y="185" width="305" height="145" rx="12" fill="#eaf8ee" stroke="#58a56e" stroke-width="2"/><text class="boxTitle" x="600" y="220">Licensed Labelled Plan Dataset</text><text class="boxText" x="600" y="250">Brief + plot boundary + setbacks</text><text class="boxText" x="600" y="274">Room polygons + doors + windows</text><text class="boxText" x="600" y="298">Adjacency + architect validation</text>
    <rect x="448" y="390" width="305" height="105" rx="12" fill="#eaf8ee" stroke="#58a56e" stroke-width="2"/><text class="boxTitle" x="600" y="429">Pre-processing and Training</text><text class="boxText" x="600" y="457">Geometry normalisation · labels</text><text class="boxText" x="600" y="480">Project-level train / test split</text>
    <rect x="845" y="185" width="360" height="105" rx="12" fill="#fff3df" stroke="#e49a34" stroke-width="2"/><text class="boxTitle" x="1025" y="223">Hard Constraint Engine</text><text class="boxText" x="1025" y="252">Setbacks · area · access · Vastu rules</text><text class="boxText" x="1025" y="275">Required rooms and dimensions</text>
    <rect x="845" y="350" width="360" height="125" rx="12" fill="#eee9ff" stroke="#846fd1" stroke-width="2"/><text class="boxTitle" x="1025" y="388">Deep Learning Layout Model</text><text class="boxText" x="1025" y="417">GNN: room adjacency prediction</text><text class="boxText" x="1025" y="441">Conditional generator: room geometry</text><text class="small" x="1025" y="463">trained using the labelled plan dataset</text>
    <rect x="845" y="535" width="360" height="105" rx="12" fill="#fff3df" stroke="#e49a34" stroke-width="2"/><text class="boxTitle" x="1025" y="573">Validation and Ranking</text><text class="boxText" x="1025" y="602">Reject overlaps and invalid access</text><text class="boxText" x="1025" y="625">Rank valid candidate layouts</text>
    <rect x="1260" y="210" width="165" height="95" rx="12" fill="#e9f1ff" stroke="#5b91ca" stroke-width="2"/><text class="boxTitle" x="1342" y="246">SVG Rendering</text><text class="boxText" x="1342" y="274">2D and 3D views</text>
    <rect x="1260" y="380" width="165" height="185" rx="12" fill="#e9f1ff" stroke="#5b91ca" stroke-width="2"/><text class="boxTitle" x="1342" y="416">Generated Outputs</text><text class="boxText" x="1342" y="449">Pencil plan</text><text class="boxText" x="1342" y="476">Furnished 2D plan</text><text class="boxText" x="1342" y="503">3D-style plan</text><text class="boxText" x="1342" y="530">Layout alternatives</text>
    <rect x="1260" y="640" width="165" height="82" rx="12" fill="#1b6ca8" stroke="#12517e" stroke-width="2"/><text x="1342" y="689" font-family="Arial, sans-serif" font-size="19" font-weight="700" fill="white" text-anchor="middle">Save / Download</text>
  </g>
  <path class="line" d="M237 300 V360"/><path class="line" d="M390 410 H790 V238 H845"/><path class="line" d="M1025 290 V350"/><path class="dash" d="M753 442 H800 V412 H845"/><path class="dash" d="M600 330 V390"/><path class="line" d="M1025 475 V535"/><path class="line" d="M1205 587 H1232 V257 H1260"/><path class="line" d="M1342 305 V380"/><path class="line" d="M1342 565 V640"/>
  <rect x="155" y="790" width="1190" height="63" rx="10" fill="#fff8e8" stroke="#e3b64d" stroke-width="2"/><text x="750" y="817" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#7d5a16" text-anchor="middle">Implementation note: the present application uses the requirement-processing, rule-based validation, and SVG-rendering blocks.</text><text x="750" y="840" font-family="Arial, sans-serif" font-size="15" fill="#7d5a16" text-anchor="middle">The labelled dataset and deep-learning model are the proposed upgrade and require licensed architect-reviewed plans.</text>
</svg>
